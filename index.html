<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="QuoteFlow — Discover inspiring random quotes, save your favorites, and enjoy a beautiful offline-ready experience.">
    <meta name="theme-color" content="#0b0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>QuoteFlow — Random Quote Generator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="ambient-bg">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="gradient-sphere sphere-3"></div>
        <div class="noise-overlay"></div>
    </div>

    
    <div id="app" class="app-container">

       
        <header class="app-header">
            <div class="logo-group">
                <div class="logo-mark">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                        <path d="M6 8C6 8 6 20 14 20C14 20 10 20 10 14C10 9 14 8 14 8" stroke="url(#qg1)" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M16 8C16 8 16 20 24 20C24 20 20 20 20 14C20 9 24 8 24 8" stroke="url(#qg2)" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="14" cy="24" r="2" fill="url(#qg1)"/>
                        <circle cx="24" cy="24" r="2" fill="url(#qg2)"/>
                        <defs>
                            <linearGradient id="qg1" x1="6" y1="8" x2="14" y2="24"><stop stop-color="#f97316"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
                            <linearGradient id="qg2" x1="16" y1="8" x2="24" y2="24"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="logo-text">Quote<span>Flow</span></h1>
            </div>
            <nav class="header-nav">
                <button id="btn-tab-discover" class="tab-btn active" data-tab="discover">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                    Discover
                </button>
                <button id="btn-tab-favorites" class="tab-btn" data-tab="favorites">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    Favorites
                    <span class="fav-badge hidden" id="fav-badge">0</span>
                </button>
            </nav>
        </header>

        
        <main id="tab-discover" class="tab-content active">
            
            <div class="genre-filters" id="genre-filters">
                <button class="genre-chip active" data-genre="all">All</button>
                
            </div>

         
            <div class="quote-stage">
                <article class="quote-card" id="quote-card">
                    <div class="card-glow"></div>
                    <div class="quote-marks">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" opacity="0.12">
                            <path d="M8 12C8 12 8 28 18 28C18 28 13 28 13 20C13 13 18 12 18 12H8Z" fill="currentColor"/>
                            <path d="M26 12C26 12 26 28 36 28C36 28 31 28 31 20C31 13 36 12 36 12H26Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <blockquote id="quote-text" class="quote-text">Loading…</blockquote>
                    <div class="quote-meta">
                        <cite id="quote-author" class="quote-author">—</cite>
                        <span id="quote-genre" class="quote-genre-tag"></span>
                    </div>
                    <div class="card-actions">
                        <button id="btn-favorite" class="action-btn" title="Add to favorites" aria-label="Favorite this quote">
                            <svg class="heart-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        </button>
                        <button id="btn-copy" class="action-btn" title="Copy quote" aria-label="Copy quote to clipboard">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </button>
                        <button id="btn-share" class="action-btn" title="Share quote" aria-label="Share this quote">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        </button>
                    </div>
                </article>
            </div>

            <!-- New Quote Button -->
            <div class="new-quote-wrapper">
                <button id="btn-new-quote" class="btn-new-quote">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    New Quote
                </button>
            </div>
        </main>

        <!-- ═══════ FAVORITES TAB ═══════ -->
        <section id="tab-favorites" class="tab-content">
            <div id="favorites-empty" class="favorites-empty">
                <div class="empty-heart">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                </div>
                <h2>No favorites yet</h2>
                <p>Tap the heart icon on any quote to save it here.</p>
            </div>
            <div id="favorites-list" class="favorites-list"></div>
        </section>

        
        <div id="toast" class="toast hidden" role="alert" aria-live="polite"></div>
    </div>

    <script src="js/quotes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
